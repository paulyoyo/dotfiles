"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_orange)\
$os\
$username\
[](bg:color_yellow fg:color_orange)\
$directory\
[](fg:color_yellow bg:color_aqua)\
$git_branch\
$git_status\
$git_state\
[](fg:color_aqua bg:color_blue)\
$c\
$cpp\
$ruby\
$nodejs\
$python\
[](fg:color_blue bg:color_bg3)\
$direnv\
$docker_context\
[](fg:color_bg3 bg:color_bg1)\
$jobs\
$cmd_duration\
$status\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'salvaje'

# 1:1 port of https://starship.rs/presets/gruvbox-rainbow
# Only the 10 palette hex values are changed to the Salvaje palette.
# Variable names kept identical so this stays diffable against upstream.
#
#   color_fg0     Bright Snow    #F7F7F5
#   color_bg1     Near-black     #120E15
#   color_bg3     Lilac-grey     #2A1A38
#   color_blue    Deep Lilac     #8956BA
#   color_aqua    Teal           #6AAFB8
#   color_green   Sage           #8FBF6C
#   color_orange  Wisteria       #C599E2
#   color_purple  Bright Lilac   #A474D4
#   color_red     Rose           #E0637A
#   color_yellow  Golden Glow    #EAD82F
[palettes.salvaje]
color_fg0    = '#F7F7F5'
color_bg1    = '#120E15'
color_bg3    = '#2A1A38'
color_blue   = '#8956BA'
color_aqua   = '#6AAFB8'
color_green  = '#8FBF6C'
color_orange = '#C599E2'
color_purple = '#A474D4'
color_red    = '#E0637A'
color_yellow = '#EAD82F'

[os]
disabled = false
style = "bg:color_orange fg:color_fg0"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_orange fg:color_fg0"
style_root = "bg:color_orange fg:color_fg0"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)'

[git_state]
# REBASING / MERGING / CHERRY-PICKING with progress. git_branch alone
# does not show that a rebase is half-finished.
style = "bg:color_aqua"
format = '[[ $state( $progress_current/$progress_total) ](fg:color_red bg:color_aqua)]($style)'

[nodejs]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[c]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[cpp]
symbol = " "
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[ruby]
# Rails work lives here: reads .ruby-version / Gemfile via the rbenv shim.
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[python]
symbol = ""
style = "bg:color_blue"
format = '[[ $symbol( $version) ](fg:color_fg0 bg:color_blue)]($style)'

[direnv]
# Off by default in starship. The useful case is not "it loaded", it is
# seeing that the .envrc is blocked, which is when env vars go missing.
disabled = false
symbol = ""
allowed_msg = ""
not_allowed_msg = " blocked"
denied_msg = " denied"
style = "bg:color_bg3"
format = '[[ $symbol$allowed ](fg:#88CCD4 bg:color_bg3)]($style)'

[docker_context]
symbol = ""
style = "bg:color_bg3"
format = '[[ $symbol( $context) ](fg:#88CCD4 bg:color_bg3)]($style)'

[jobs]
# Background jobs, e.g. a suspended rails server.
symbol = ""
number_threshold = 1
style = "bg:color_bg1"
format = '[[ $symbol $number ](fg:color_yellow bg:color_bg1)]($style)'

[cmd_duration]
# p10k's command_execution_time. Only appears past min_time.
min_time = 2000
style = "bg:color_bg1"
format = '[[  $duration ](fg:color_yellow bg:color_bg1)]($style)'

[status]
# Exit code of the last command. p10k showed this by default; starship
# does not. Only renders when the status is non-zero.
disabled = false
map_symbol = false
style = "bg:color_bg1"
format = '[[  $status ](fg:color_red bg:color_bg1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
